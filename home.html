    <style>
        /* Reset some default styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #eaf0f6;
            color: #333;
            background-color: #4A628A;
        }

        .container {
            text-align: center;
            padding: 50px;
        }

        h1 {
            font-weight: 700;
            font-size: 2em;
            color:#B9E5E8;
            padding-bottom: 1rem;
            
        }

        .member-grid {
            display: flex;
            justify-content: space-around;
            gap: 70px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .member {
            text-align: center;
        }

        .member img {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            border: 4px solid #B9E5E8;
            object-fit: cover;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.7);
            
        }

        .member img:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .member h3 {
            font-size: 1.1em;
            margin-top: 10px;
            color: white;
        }

        .member p {
            font-size: 0.9em;
            color: #B9E5E8;
        }
        .ico{
